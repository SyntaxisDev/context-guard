name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.14 python scripts/build_release.py --tag "$GITHUB_REF_NAME"

  ci:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.14 python cli.py package --runtime all --marketplace context-guard --out dist
      - run: uv run --python 3.14 python scripts/build_release.py --out dist --tag "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS
          --title "context-guard $GITHUB_REF_NAME" --generate-notes --verify-tag
